apiVersion: apps/v1
kind: Deployment
metadata:
  name: seronz-api
  labels:
    app: seronz-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: seronz-api
  template:
    metadata:
      labels:
        app: seronz-api
    spec:
      containers:
        - name: api
          image: seronz/seronz-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          envFrom:
            - secretRef:
                name: seronz-api-secret
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
